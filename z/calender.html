<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - August 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            padding: 40px 20px;
        }

        .calendar {
            max-width: 780px;
            margin: 0 auto;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .cal-header {
            background: #4338ca;
            color: #fff;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cal-header h1 {
            font-size: 22px;
        }

        .cal-header .nav-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        caption {
            caption-side: top;
            text-align: left;
            padding: 16px 24px 0;
            font-size: 13px;
            color: #64748b;
        }

        thead th {
            padding: 14px 8px;
            background: #eef2ff;
            color: #4338ca;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tbody td {
            height: 84px;
            width: 14.28%;
            vertical-align: top;
            padding: 8px;
            border: 1px solid #f1f5f9;
            font-size: 14px;
        }

        tbody td.muted {
            color: #cbd5e1;
        }

        tbody td.today {
            background: #eef2ff;
        }

        tbody td.today .day-num {
            background: #4338ca;
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .day-num {
            font-weight: 600;
        }

        .event {
            display: block;
            margin-top: 6px;
            background: #fef9c3;
            color: #854d0e;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event.deadline {
            background: #fee2e2;
            color: #991b1b;
        }

        .legend {
            display: flex;
            gap: 20px;
            padding: 16px 24px 24px;
            font-size: 12px;
            flex-wrap: wrap;
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend i {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-event {
            background: #fde047;
        }

        .dot-deadline {
            background: #f87171;
        }
    </style>
</head>

<body>

    <div class="calendar">

        <div class="cal-header">
            <button class="nav-btn" aria-label="Previous month">&#8249;</button>
            <h1>August 2026</h1>
            <button class="nav-btn" aria-label="Next month">&#8250;</button>
        </div>

        <table>
            <caption>Monthly view showing scheduled events and deadlines</caption>
            <thead>
                <tr>
                    <th scope="col">Sun</th>
                    <th scope="col">Mon</th>
                    <th scope="col">Tue</th>
                    <th scope="col">Wed</th>
                    <th scope="col">Thu</th>
                    <th scope="col">Fri</th>
                    <th scope="col">Sat</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="muted"><span class="day-num">26</span></td>
                    <td class="muted"><span class="day-num">27</span></td>
                    <td class="muted"><span class="day-num">28</span></td>
                    <td class="muted"><span class="day-num">29</span></td>
                    <td class="muted"><span class="day-num">30</span></td>
                    <td class="muted"><span class="day-num">31</span></td>
                    <td><span class="day-num">1</span></td>
                </tr>
                <tr>
                    <td><span class="day-num">2</span></td>
                    <td><span class="day-num">3</span><span class="event">Team Sync</span></td>
                    <td><span class="day-num">4</span></td>
                    <td><span class="day-num">5</span><span class="event deadline">Invoice Due</span></td>
                    <td><span class="day-num">6</span></td>
                    <td><span class="day-num">7</span></td>
                    <td><span class="day-num">8</span></td>
                </tr>
                <tr>
                    <td><span class="day-num">9</span></td>
                    <td><span class="day-num">10</span></td>
                    <td><span class="day-num">11</span></td>
                    <td><span class="day-num">12</span><span class="event">Client Call</span></td>
                    <td><span class="day-num">13</span></td>
                    <td><span class="day-num">14</span></td>
                    <td><span class="day-num">15</span></td>
                </tr>
                <tr>
                    <td><span class="day-num">16</span></td>
                    <td><span class="day-num">17</span></td>
                    <td><span class="day-num">18</span><span class="event deadline">Project Deadline</span></td>
                    <td><span class="day-num">19</span></td>
                    <td><span class="day-num">20</span></td>
                    <td><span class="day-num">21</span></td>
                    <td><span class="day-num">22</span></td>
                </tr>
                <tr>
                    <td><span class="day-num">23</span></td>
                    <td><span class="day-num">24</span></td>
                    <td class="today"><span class="day-num">25</span><span class="event">Robotics Meet</span></td>
                    <td><span class="day-num">26</span></td>
                    <td><span class="day-num">27</span></td>
                    <td><span class="day-num">28</span></td>
                    <td><span class="day-num">29</span></td>
                </tr>
                <tr>
                    <td><span class="day-num">30</span></td>
                    <td><span class="day-num">31</span></td>
                    <td class="muted"><span class="day-num">1</span></td>
                    <td class="muted"><span class="day-num">2</span></td>
                    <td class="muted"><span class="day-num">3</span></td>
                    <td class="muted"><span class="day-num">4</span></td>
                    <td class="muted"><span class="day-num">5</span></td>
                </tr>
            </tbody>
        </table>

        <div class="legend">
            <span><i class="dot-event"></i> Event</span>
            <span><i class="dot-deadline"></i> Deadline</span>
        </div>

    </div>

</body>

</html>
